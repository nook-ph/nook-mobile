name: Android release AAB

# Builds a Play-signed (upload key) .aab, keeps it as a run artifact, and uploads it to Google Play.
# Uses signing secrets, so it must never run on pull_request (forks could read them).
# Required secrets are listed in docs/release_ci.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      track:
        description: Play track to upload to
        type: choice
        options: [internal, alpha, beta]
        default: internal

permissions:
  contents: read

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PACKAGE_NAME: app.nookph
      # Tag pushes always go to internal for QA. Production only via the
      # "Android promote to production" workflow, after QA.
      TRACK: ${{ inputs.track || 'internal' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true

      - name: Write .env
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          UPLOAD_PRESIGN_URL: ${{ secrets.UPLOAD_PRESIGN_URL }}
        run: |
          : "${SUPABASE_URL:?missing secret SUPABASE_URL}" "${SUPABASE_KEY:?missing secret SUPABASE_KEY}"
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_KEY=$SUPABASE_KEY"
            echo "POSTHOG_PROJECT_TOKEN=$POSTHOG_PROJECT_TOKEN"
            echo "POSTHOG_HOST=$POSTHOG_HOST"
            echo "UPLOAD_PRESIGN_URL=$UPLOAD_PRESIGN_URL"
          } > .env

      # android/app/build.gradle.kts signs release builds from android/key.properties,
      # the same file used for local release builds.
      - name: Install upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          : "${KEYSTORE_BASE64:?missing secret ANDROID_KEYSTORE_BASE64}" "${KEYSTORE_PASSWORD:?missing secret ANDROID_KEYSTORE_PASSWORD}"
          : "${KEY_ALIAS:?missing secret ANDROID_KEY_ALIAS}" "${KEY_PASSWORD:?missing secret ANDROID_KEY_PASSWORD}"
          KEYSTORE="$RUNNER_TEMP/upload-keystore.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          {
            echo "storeFile=$KEYSTORE"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - run: flutter pub get

      # Same scheme as iOS: version codes start past the last manual upload (1.1.3+12);
      # the version name still comes from pubspec.yaml, so bump it before tagging.
      - name: Build signed app bundle
        run: flutter build appbundle --release --build-number=$((100 + GITHUB_RUN_NUMBER))

      - uses: actions/upload-artifact@v4
        with:
          name: nook-android-${{ github.ref_name }}-${{ github.run_number }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

      # Reuses the iOS "What's New" text so one file covers both stores (Play allows 500 characters).
      - name: Prepare release notes
        id: notes
        run: |
          NOTES="ios/metadata/en-US/release_notes.txt"
          DIR="$RUNNER_TEMP/whatsnew"
          mkdir -p "$DIR"
          if [ -s "$NOTES" ]; then
            if [ "$(wc -m < "$NOTES")" -gt 500 ]; then
              echo "::error::$NOTES is over Play's 500-character limit"
              exit 1
            fi
            cp "$NOTES" "$DIR/whatsnew-en-US"
            echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          fi
          MAPPING="build/app/outputs/mapping/release/mapping.txt"
          if [ -f "$MAPPING" ]; then
            echo "mapping=$MAPPING" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ env.TRACK }}
          status: completed
          whatsNewDirectory: ${{ steps.notes.outputs.dir }}
          mappingFile: ${{ steps.notes.outputs.mapping }}
